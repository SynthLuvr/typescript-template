name: CI

on:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install pandoc (pinned for Markdown lint/format)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-1-amd64.deb
          sudo dpkg -i pandoc-3.10.2-1-amd64.deb
          pandoc --version | head -1

      - name: Install pandoc (pinned for Markdown lint/format)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\pandoc.zip"
          Invoke-WebRequest `
            -Uri https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-windows-x86_64.zip `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\pandoc"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\pandoc\pandoc-3.10.2"
          & "$env:RUNNER_TEMP\pandoc\pandoc-3.10.2\pandoc.exe" --version |
            Select-Object -First 1

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
